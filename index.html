<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galvanometer Conversion Calculator & Visualizer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-page: #0f172a;
            --card-bg: #1e293b;
            --card-inner: #0f172a;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .widget-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 850px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .widget-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
        }

        .widget-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tabs {
            display: flex;
            background: var(--card-inner);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        .widget-body {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .widget-body {
                grid-template-columns: 1fr;
            }
        }

        .inputs-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-card {
            background: var(--card-inner);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-card label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 700;
            width: 60%;
            direction: ltr;
            text-align: right;
        }

        .input-row .unit-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--border);
        }

        .display-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #34d399;
            direction: ltr;
        }

        .stat-sub {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
            direction: ltr;
        }

        .schematic-box {
            background: var(--card-inner);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .schematic-header {
            font-size: 0.75rem;
            color: var(--text-muted);
            align-self: flex-start;
            margin-bottom: 6px;
            font-weight: 600;
        }

        svg {
            width: 100%;
            height: 150px;
        }

        .formula-inline {
            background: var(--card-inner);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.82rem;
            color: #e2e8f0;
            direction: ltr;
            text-align: center;
            font-family: 'Consolas', monospace;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="widget-header">
        <div class="widget-title">
            <span>⚡</span> حاسبة تحويل الجلفانومتر التفاعلية
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="tab-v" onclick="switchMode('voltmeter')">فولتميتر (V)</button>
            <button class="tab-btn" id="tab-a" onclick="switchMode('ammeter')">أميتر (A)</button>
        </div>
    </div>

    <div class="widget-body">
        <div class="inputs-col">
            <div class="input-card">
                <label>مقاومة الجلفانومتر (Rg)</label>
                <div class="input-row">
                    <input type="number" id="in-rg" value="100" min="0.1" step="any" oninput="updateCalc()">
                    <span class="unit-badge">Ω</span>
                </div>
            </div>

            <div class="input-card">
                <label>أقصى تيار للجلفانومتر (Ig)</label>
                <div class="input-row">
                    <input type="number" id="in-ig" value="0.6" min="0.001" step="any" oninput="updateCalc()">
                    <span class="unit-badge">mA</span>
                </div>
            </div>

            <div class="input-card">
                <label id="lbl-target">أقصى مدى جهد مراد قياسه (V)</label>
                <div class="input-row">
                    <input type="number" id="in-target" value="10" min="0.01" step="any" oninput="updateCalc()">
                    <span class="unit-badge" id="badge-target">V</span>
                </div>
            </div>

            <div class="formula-inline" id="calc-formula">
                Rm = (V / Ig) - Rg
            </div>
        </div>

        <div class="display-col">
            <div class="stat-card">
                <div class="stat-label" id="res-label">مقاومة مضاعف الجهد المطلوبة (Rm)</div>
                <div class="stat-value" id="res-val">16.567 kΩ</div>
                <div class="stat-sub" id="res-req">Req = 16.667 kΩ</div>
            </div>

            <div class="schematic-box">
                <div class="schematic-header">LIVE CIRCUIT SCHEMATIC</div>
                <svg id="svg-circuit" viewBox="0 0 400 140">
                </svg>
            </div>
        </div>
    </div>
</div>

<script>
    let mode = 'voltmeter';

    function switchMode(newMode) {
        mode = newMode;
        document.getElementById('tab-v').classList.toggle('active', mode === 'voltmeter');
        document.getElementById('tab-a').classList.toggle('active', mode === 'ammeter');

        const lblTarget = document.getElementById('lbl-target');
        const badgeTarget = document.getElementById('badge-target');
        const inTarget = document.getElementById('in-target');

        if (mode === 'voltmeter') {
            lblTarget.innerText = 'أقصى مدى جهد مراد قياسه (V)';
            badgeTarget.innerText = 'V';
            inTarget.value = '10';
        } else {
            lblTarget.innerText = 'أقصى مدى تيار مراد قياسه (I)';
            badgeTarget.innerText = 'mA';
            inTarget.value = '50';
        }
        updateCalc();
    }

    function updateCalc() {
        const Rg = parseFloat(document.getElementById('in-rg').value) || 0;
        const Ig_mA = parseFloat(document.getElementById('in-ig').value) || 0;
        const Ig = Ig_mA / 1000;
        const targetVal = parseFloat(document.getElementById('in-target').value) || 0;

        const resLabel = document.getElementById('res-label');
        const resVal = document.getElementById('res-val');
        const resReq = document.getElementById('res-req');
        const calcFormula = document.getElementById('calc-formula');

        if (Ig <= 0 || Rg <= 0 || targetVal <= 0) {
            resVal.innerText = '--';
            resReq.innerText = '--';
            return;
        }

        if (mode === 'voltmeter') {
            const V = targetVal;
            calcFormula.innerText = `Rm = (${V}V / ${Ig_mA}mA) - ${Rg}Ω`;
            const Rm = (V / Ig) - Rg;
            const Req = Rg + Rm;

            resLabel.innerText = 'مقاومة مضاعف الجهد المطلوبة (Rm)';
            if (Rm < 0) {
                resVal.innerText = 'Invalid Range';
                resReq.innerText = 'V must be > Vg';
            } else {
                resVal.innerText = formatOhms(Rm);
                resReq.innerText = `Total Meter Resistance (Req) = ${formatOhms(Req)}`;
            }
            renderVoltmeterSVG(Rm, Rg, V);
        } else {
            const I_mA = targetVal;
            const I = I_mA / 1000;
            calcFormula.innerText = `Rs = (${Ig_mA}mA × ${Rg}Ω) / (${I_mA}mA - ${Ig_mA}mA)`;

            resLabel.innerText = 'مقاومة مجزئ التيار المطلوبة (Rs)';
            if (I <= Ig) {
                resVal.innerText = 'Invalid Range';
                resReq.innerText = 'Target I must be > Ig';
                renderAmmeterSVG(0, Rg, I_mA);
            } else {
                const Rs = (Ig * Rg) / (I - Ig);
                const Req = (Rg * Rs) / (Rg + Rs);
                resVal.innerText = formatOhms(Rs);
                resReq.innerText = `Total Meter Resistance (Req) = ${formatOhms(Req)}`;
                renderAmmeterSVG(Rs, Rg, I_mA);
            }
        }
    }

    function formatOhms(num) {
        if (num >= 1e6) return (num / 1e6).toFixed(3) + ' MΩ';
        if (num >= 1e3) return (num / 1e3).toFixed(3) + ' kΩ';
        return num.toFixed(3) + ' Ω';
    }

    function renderVoltmeterSVG(Rm, Rg, V) {
        const svg = document.getElementById('svg-circuit');
        svg.innerHTML = `
            <line x1="30" y1="70" x2="110" y2="70" stroke="#38bdf8" stroke-width="3" />
            <rect x="110" y="48" width="80" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
            <text x="150" y="74" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Rm</text>
            <text x="150" y="108" fill="#94a3b8" font-size="10" text-anchor="middle">${formatOhms(Rm)}</text>
            
            <line x1="190" y1="70" x2="250" y2="70" stroke="#38bdf8" stroke-width="3" />
            
            <circle cx="280" cy="70" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
            <text x="280" y="76" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">G</text>
            <text x="280" y="112" fill="#94a3b8" font-size="10" text-anchor="middle">Rg = ${Rg}Ω</text>
            
            <line x1="308" y1="70" x2="370" y2="70" stroke="#38bdf8" stroke-width="3" />

            <circle cx="30" cy="70" r="6" fill="#ef4444" />
            <circle cx="370" cy="70" r="6" fill="#64748b" />
            <text x="30" y="46" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">+</text>
            <text x="370" y="46" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">-</text>

            <path d="M 30 125 L 370 125" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
            <text x="200" y="137" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">V_max = ${V} V</text>
        `;
    }

    function renderAmmeterSVG(Rs, Rg, I) {
        const svg = document.getElementById('svg-circuit');
        svg.innerHTML = `
            <line x1="30" y1="70" x2="90" y2="70" stroke="#38bdf8" stroke-width="3" />
            <line x1="90" y1="35" x2="90" y2="105" stroke="#38bdf8" stroke-width="3" />
            
            <line x1="90" y1="35" x2="170" y2="35" stroke="#38bdf8" stroke-width="2.5" />
            <circle cx="200" cy="35" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
            <text x="200" y="41" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">G</text>
            <text x="200" y="10" fill="#94a3b8" font-size="9" text-anchor="middle">Rg=${Rg}Ω</text>
            <line x1="222" y1="35" x2="310" y2="35" stroke="#38bdf8" stroke-width="2.5" />
            
            <line x1="90" y1="105" x2="160" y2="105" stroke="#38bdf8" stroke-width="2.5" />
            <rect x="160" y="87" width="80" height="36" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
            <text x="200" y="108" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">Rs (Shunt)</text>
            <text x="200" y="136" fill="#94a3b8" font-size="10" text-anchor="middle">${formatOhms(Rs)}</text>
            <line x1="240" y1="105" x2="310" y2="105" stroke="#38bdf8" stroke-width="2.5" />
            
            <line x1="310" y1="35" x2="310" y2="105" stroke="#38bdf8" stroke-width="3" />
            <line x1="310" y1="70" x2="370" y2="70" stroke="#38bdf8" stroke-width="3" />

            <circle cx="30" cy="70" r="6" fill="#ef4444" />
            <circle cx="370" cy="70" r="6" fill="#64748b" />
            <text x="30" y="52" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">+ (I = ${I}mA)</text>
            <text x="370" y="52" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">-</text>
        `;
    }

    updateCalc();
</script>

</body>
</html>
